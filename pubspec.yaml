name: premium_store_admin
description: "Premium Store admin app for Android and iOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  permission_handler: ^12.0.1
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  shared_preferences: ^2.5.6
  google_fonts: ^8.2.1
  path_provider: ^2.1.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#071E4B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#071E4B"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#071E4B"
    image: assets/splash/splash_logo_android12.png
    icon_background_color: "#071E4B"
  fullscreen: false
